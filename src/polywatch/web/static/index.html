<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>polywatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141a2a'/%3E%3Crect x='6' y='14.5' width='20' height='3' rx='1.5' fill='%23323c58'/%3E%3Ccircle cx='12' cy='16' r='3.5' fill='%239aa7ff'/%3E%3Ccircle cx='21' cy='16' r='3.5' fill='%2341d492'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="14.5" width="26" height="3" rx="1.5" class="rail-bg"/><circle cx="11" cy="16" r="4" class="dot-entry"/><circle cx="22" cy="16" r="4" class="dot-now"/></svg>
      <span>polywatch</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <a role="tab" href="#live" data-tab="live">Live bets <span class="count" data-count="live"></span></a>
      <a role="tab" href="#common" data-tab="common">Common trades <span class="count" data-count="common"></span></a>
      <a role="tab" href="#traders" data-tab="traders">Traders</a>
      <a role="tab" href="#positions" data-tab="positions">My positions <span class="count" data-count="positions"></span></a>
      <a role="tab" href="#short" data-tab="short">Short markets</a>
    </nav>
    <div class="status" id="status"></div>
    <button class="icon-btn" id="open-settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="link-btn" id="reset-filters">Reset</button>
        <button class="icon-btn only-mobile" id="close-filters" aria-label="Close filters">✕</button>
      </div>
      <div id="filter-body"></div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab only-mobile" id="open-filters">Filters <span id="filter-badge"></span></button>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="icon-btn drawer-close" data-close aria-label="Close">✕</button>
      <div id="drawer-body"></div>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
